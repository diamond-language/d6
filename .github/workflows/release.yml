name: release

# Pushing a vX.Y.Z tag builds the .deb, the .rpms (Fedora 44 and 45) and the tarball from
# the tagged tree on x86-64 and on arm64 hardware, installs each into a clean container and
# smoke-tests it (packaging/ci.sh). Then it creates the GitHub release with every package
# attached and the changelog section as its notes. Stable tags also build and
# check the public docs and browser runtime before publishing. The portable static tools
# (tools/build_portable.sh) are
# built and tested by ci.yml but not attached until their limits are resolved. A
# release is only tagged after the PR run for the same tree passed, so this
# workflow does not repeat the test matrix.
# workflow_dispatch reruns it for an existing tag; the tag must contain
# packaging/ (0.20 and later).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.20.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        package:
          - {format: deb, image: 'ubuntu:26.04', name: deb}
          - {format: rpm, image: 'fedora:44', name: rpm-fc44}
          - {format: rpm, image: 'fedora:45', name: rpm-fc45}
          - {format: tar, image: '', name: tar}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 1
      - name: Build, install and smoke-test the ${{ matrix.package.name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/ci.sh ${{ matrix.package.format }} ${{ matrix.package.image }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.package.name }}-${{ matrix.runner }}
          path: build/packages/${{ matrix.package.format }}/*.${{ matrix.package.format == 'tar' && 'tar.gz' || matrix.package.format }}
          if-no-files-found: error

  site:
    needs: package
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
      options: --init --memory=4g --memory-swap=4g
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      WASI_SDK: /opt/wasi-sdk
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gcc git libc6-dev make nodejs openssl libcrypt-dev libmariadb3 libpq5 libsqlite3-0 zlib1g
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 1
          persist-credentials: false
      # Historical tags can still be rebuilt with workflow_dispatch.
      - name: Check whether this tag includes site packaging
        id: site
        run: |
          if test -f packaging/build_site_release.sh; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.site.outputs.supported == 'true'
        with:
          name: tar-ubuntu-latest
          path: release-packages
      - name: Install pinned wasi-sdk
        if: steps.site.outputs.supported == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh tools/fetch_release_asset.sh WebAssembly/wasi-sdk wasi-sdk-34 wasi-sdk-34.0-x86_64-linux.tar.gz \
            wasi-sdk.tar.gz b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
          mkdir -p "$WASI_SDK"
          tar xzf wasi-sdk.tar.gz -C "$WASI_SDK" --strip-components=1
      - name: Build and check the release website assets
        if: steps.site.outputs.supported == 'true'
        shell: bash
        run: bash packaging/build_site_release.sh "$TAG" "release-packages/d6-${TAG#v}-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.site.outputs.supported == 'true'
        with:
          name: site-${{ inputs.tag || github.ref_name }}
          path: build/site-release-*/
          if-no-files-found: error

  vscode:
    # The VS Code extension (editors/vscode) as a .vsix attached to the release, and published
    # to the Visual Studio Marketplace, and to Open VSX when OVSX_PAT is configured. The
    # Marketplace step authenticates by trusted publishing (GitHub OIDC): the rolld6 publisher
    # has a policy for this repository and release.yml, so there is no token to store. The
    # extension is versioned on its own (editors/vscode/package.json), so a release that does
    # not bump it skips the stores (--skip-duplicate) and only attaches the file.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # vsce 4 needs Node 22 or later
      - name: Package the extension
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce@4.1.0 package --out ../../d6-vscode.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vscode
          path: d6-vscode.vsix
          if-no-files-found: error
      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath d6-vscode.vsix --skip-duplicate
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx@1.3.0 publish d6-vscode.vsix --pat "$OVSX_PAT" --skip-duplicate

  publish:
    needs: [package, vscode, site]
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.vscode.result == 'success' && (needs.site.result == 'success' || needs.site.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Creating the release and uploading its files is the only write.
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: packages
          merge-multiple: true
          pattern: '{deb-*,rpm-*,tar-*,vscode}'
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/publish_release.sh "$TAG" packages/*.deb packages/*.rpm packages/*.tar.gz packages/*.vsix
